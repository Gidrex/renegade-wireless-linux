name: Release

# Pushing a tag vX.Y.Z builds both binaries and publishes a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    # Older Ubuntu → older glibc → the binaries run on more distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries for the GUI
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo build --release
      - name: Package
        run: |
          name=renegade-${GITHUB_REF_NAME}-x86_64-linux
          mkdir "$name"
          cp target/release/renegade target/release/renegade-gui README.md LICENSE 70-renegade.rules "$name"/
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            renegade-*.tar.gz
            renegade-*.tar.gz.sha256
